# =============================================================================
# GITHUB ACTIONS CI/CD WORKFLOW
# Project: Delivery Hub Management System (IT3180)
# Purpose: Kiểm thử tự động và rà soát chất lượng mã nguồn mỗi khi có Pull Request vào nhánh main
# =============================================================================

name: "Delivery Hub CI - Pull Request Quality Gate"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/delivery_hub?schema=public"
  NODE_ENV: "test"
  JWT_SECRET: "ci-test-jwt-secret-key-delivery-hub-it3180-system-secure-32chars"
  JWT_EXPIRES_IN: "1d"

jobs:
  quality-gate:
    name: "Architectural Guardrails & Automated Testing"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Khởi tạo tự động Service Container PostgreSQL 16 cho môi trường CI của GitHub Actions
    # Giúp chạy 100% các bài Integration Test trên PostgreSQL thực mà không cần cài đặt ngoài
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delivery_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Bước 1: Kéo mã nguồn từ GitHub về máy ảo Ubuntu
      - name: "1. Checkout repository code"
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Node.js (phiên bản 22.x LTS mới nhất) và kích hoạt cache cho npm
      - name: "2. Setup Node.js 22.x environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Bước 3: Cài đặt chính xác các dependencies từ package-lock.json
      - name: "3. Install dependencies"
        run: npm ci

      # Bước 4: Chạy vòng lặp kiểm tra rào chắn kiến trúc Clean Architecture
      # (Kiểm tra 17 thư mục, cấm vi phạm import giữa các tầng, cấm rò rỉ Client Component, cấm hardcode, cấm 'any')
      - name: "4. Verify Clean Architecture Guardrails"
        run: npm run verify

      # Bước 5: Kiểm tra cú pháp và cấu trúc của Prisma Schema
      - name: "5. Validate Prisma Schema"
        run: npx prisma validate --schema=src/infrastructure/database/prisma/schema.prisma

      # Bước 6: Sinh mã TypeScript types cho Prisma Client
      - name: "6. Generate Prisma Client types"
        run: npm run db:generate

      # Bước 6.1: Đẩy Schema và nạp dữ liệu mẫu vào PostgreSQL Service Container
      - name: "6.1. Push Schema and Seed Database in CI"
        run: |
          npm run db:push
          npm run db:seed

      # Bước 7: Chạy toàn bộ các bộ Unit & Integration Test (Domain, Application, Infrastructure)
      # Bỏ qua E2E test trong quá trình PR để đảm bảo CI chạy siêu tốc và ổn định
      - name: "7. Execute Unit & Integration Test Suites (Domain, Application, Infrastructure)"
        run: npm run test:unit

      # Bước 8: Thông báo trạng thái kiểm tra thành công
      - name: "8. Quality Gate Summary"
        if: success()
        run: |
          echo "=========================================================="
          echo "  ✔ PULL REQUEST QUALITY GATE PASSED 100%!                "
          echo "  - Clean Architecture Guardrails: PASS                   "
          echo "  - Prisma Schema & 12 Indexes: PASS                      "
          echo "  - PostgreSQL Service Container: READY & SEEDED          "
          echo "  - Domain & Infrastructure Unit/Integration Tests: PASS  "
          echo "  - Ready to merge into 'main' branch!                    "
          echo "=========================================================="
